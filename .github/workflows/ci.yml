name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --features tls -- -D warnings
      - run: cargo test
      - run: cargo test --features tls
      - name: the default build has no C code
        shell: bash
        run: |
          cargo tree -e normal,build --target all > /tmp/tree.txt
          grep -q '^s3rs v' /tmp/tree.txt
          ! grep -E ' (cc|ring|aws-lc-sys|cmake) v' /tmp/tree.txt

  e2e:
    name: end-to-end (boto3, aws-cli, minio-go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: tests/minio-go/go.sum
      - run: pip install boto3 awscli
      - run: cargo build --release
      - name: Start s3rs
        run: |
          cp tests/policies/home.json /tmp/home.json
          openssl rand -hex 32 > /tmp/s3rs.key
          printf 'rokey:rosecret:ro\nscoped:scopedsecret:rw:scoped-*,shared-scope\nalice:alicesecret:policy=home.json\n' > /tmp/creds
          # Fast lifecycle sweeps (1s) with 2-second "days" so expiration can be tested.
          S3RS_LIFECYCLE_DAY_SECS=2 ./target/release/s3rs -d /tmp/s3rs-data -l 127.0.0.1:9000 \
            --access-key testkey --secret-key testsecret --credentials-file /tmp/creds \
            --lifecycle-interval 1 --encryption-key-file /tmp/s3rs.key \
            --website-listen 127.0.0.1:9001 --website-domain web.localhost \
            --webhook test=http://127.0.0.1:9399/hook --webhook-secret hooksecret \
            --access-log json > /tmp/access.log 2> /tmp/s3rs.log &
          echo $! > /tmp/s3rs.pid
          for i in $(seq 50); do curl -sf http://127.0.0.1:9000/_health && break; sleep 0.1; done
      - name: boto3 suite
        env:
          S3RS_RO_ACCESS_KEY: rokey
          S3RS_RO_SECRET_KEY: rosecret
          S3RS_SCOPED_ACCESS_KEY: scoped
          S3RS_SCOPED_SECRET_KEY: scopedsecret
          S3RS_POLICY_ACCESS_KEY: alice
          S3RS_POLICY_SECRET_KEY: alicesecret
          S3RS_WEBHOOK_PORT: "9399"
          S3RS_WEBHOOK_SECRET: hooksecret
          S3RS_FAST_LIFECYCLE: "1"
          S3RS_ENCRYPTION: "1"
          S3RS_DATA_DIR: /tmp/s3rs-data
          S3RS_WEBSITE_ENDPOINT: http://127.0.0.1:9001
          S3RS_WEBSITE_DOMAIN: web.localhost
        run: python3 tests/e2e.py
      - name: aws-cli smoke test
        env:
          AWS_ACCESS_KEY_ID: testkey
          AWS_SECRET_ACCESS_KEY: testsecret
          AWS_DEFAULT_REGION: us-east-1
        run: |
          E="--endpoint-url http://127.0.0.1:9000"
          mkdir -p /tmp/sync/sub && head -c 20000000 /dev/urandom > /tmp/sync/big.bin && echo hi > /tmp/sync/sub/a.txt
          aws $E s3 mb s3://cli-test
          aws $E s3 sync --only-show-errors /tmp/sync s3://cli-test/data/
          aws $E s3 sync --only-show-errors s3://cli-test/data/ /tmp/sync2
          diff -r /tmp/sync /tmp/sync2
          aws $E s3 rm --only-show-errors --recursive s3://cli-test/
          aws $E s3 rb s3://cli-test
          # Static website: aws s3 website + a public-read bucket, fetched from the website endpoint.
          aws $E s3 mb s3://cli-site
          echo '<p>hello site</p>' > /tmp/index.html
          aws $E s3 cp --only-show-errors --content-type text/html /tmp/index.html s3://cli-site/index.html
          aws $E s3api put-bucket-acl --bucket cli-site --acl public-read
          aws $E s3 website s3://cli-site --index-document index.html
          curl -sf -H 'Host: cli-site.web.localhost' http://127.0.0.1:9001/ | grep -q 'hello site'
          aws $E s3 rb --force s3://cli-site
      - name: reload credentials on SIGHUP
        env:
          AWS_ACCESS_KEY_ID: newkey
          AWS_SECRET_ACCESS_KEY: newsecret
          AWS_DEFAULT_REGION: us-east-1
        run: |
          ! aws --endpoint-url http://127.0.0.1:9000 s3 ls 2>/dev/null
          echo 'newkey:newsecret:ro' >> /tmp/creds
          kill -HUP "$(cat /tmp/s3rs.pid)"
          for i in $(seq 50); do grep -q 'reloaded 5 access key' /tmp/s3rs.log && break; sleep 0.1; done
          aws --endpoint-url http://127.0.0.1:9000 s3 ls
      - name: minio-go suite
        working-directory: tests/minio-go
        run: go run .
      - name: web console (Playwright)
        env:
          S3RS_CONSOLE_URL: http://localhost:9000
          LANG: C.UTF-8  # non-ASCII download names need a UTF-8 locale in Chromium
          S3RS_ACCESS_KEY: testkey
          S3RS_SECRET_KEY: testsecret
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          node tests/console.js
      - name: healthcheck subcommand
        run: |
          ./target/release/s3rs healthcheck -l 0.0.0.0:9000
          ! ./target/release/s3rs healthcheck -l 127.0.0.1:9002
      - name: fsck after a graceful shutdown
        run: |
          kill -TERM "$(cat /tmp/s3rs.pid)"
          while kill -0 "$(cat /tmp/s3rs.pid)" 2>/dev/null; do sleep 0.2; done
          ./target/release/s3rs fsck -d /tmp/s3rs-data --deep --encryption-key-file /tmp/s3rs.key
      - name: access log (one JSON object per request, no secrets)
        run: |
          python3 - <<'PY'
          import json
          lines = open("/tmp/access.log").read().splitlines()
          assert len(lines) > 500, len(lines)
          for l in lines:
              e = json.loads(l)
              assert {"time", "request_id", "method", "path", "status", "duration_ms"} <= e.keys(), e
              q = e.get("query", "")
              for p in q.split("&"):
                  name, _, value = p.partition("=")
                  if name.lower() in ("x-amz-signature", "signature", "x-amz-security-token"):
                      assert value == "REDACTED", e
          print(len(lines), "access log lines OK;", sum("Signature" in json.loads(l).get("query", "") for l in lines), "presigned")
          PY
      - name: crash consistency (SIGKILL under concurrent writes)
        run: python3 tests/crash.py ./target/release/s3rs 8
      - name: backup and restore (online under concurrent writes, and offline)
        run: python3 tests/backup.py ./target/release/s3rs
      - name: replication between two servers
        run: python3 tests/replication.py ./target/release/s3rs
      - name: replication under crashes (SIGKILL of both servers while writing)
        run: python3 tests/replication_chaos.py ./target/release/s3rs 6
      - name: rate limits
        run: python3 tests/ratelimit.py ./target/release/s3rs
      - name: durable event notifications
        run: python3 tests/events.py ./target/release/s3rs
      - name: bucket logging
        run: python3 tests/bucketlog.py ./target/release/s3rs
      - name: access keys through the admin API
        run: python3 tests/keys.py ./target/release/s3rs
      - name: scrub test
        run: python3 tests/scrub.py ./target/release/s3rs
      - name: server-wide public access block test
        run: python3 tests/publicblock.py ./target/release/s3rs
      - name: per-bucket metrics test
        run: python3 tests/metrics.py ./target/release/s3rs
      - name: concurrency soak test (shared keys, invariants, fsck)
        run: python3 tests/soak.py ./target/release/s3rs 20
      - name: rclone compatibility
        run: |
          curl -fsSL -o /tmp/rclone.zip https://github.com/rclone/rclone/releases/download/v1.71.1/rclone-v1.71.1-linux-amd64.zip
          unzip -q -o /tmp/rclone.zip -d /tmp
          python3 tests/rclone.py ./target/release/s3rs /tmp/rclone-v1.71.1-linux-amd64/rclone
      - name: restic compatibility
        run: |
          curl -fsSL https://github.com/restic/restic/releases/download/v0.18.1/restic_0.18.1_linux_amd64.bz2 | bunzip2 > /tmp/restic
          chmod +x /tmp/restic
          python3 tests/restic.py ./target/release/s3rs /tmp/restic
      - name: container registry (distribution) on s3rs
        run: |
          curl -fsSL https://github.com/distribution/distribution/releases/download/v3.0.0/registry_3.0.0_linux_amd64.tar.gz | tar -xz -C /tmp registry
          curl -fsSL https://github.com/google/go-containerregistry/releases/download/v0.20.6/go-containerregistry_Linux_x86_64.tar.gz | tar -xz -C /tmp crane
          python3 tests/registry.py ./target/release/s3rs /tmp/registry /tmp/crane
      - name: HTTP fuzzing (mutated requests; no 500s, no panics)
        run: python3 tests/fuzz_http.py ./target/release/s3rs 20000
      - name: disk full (100 MB tmpfs)
        run: |
          sudo mkdir -p /mnt/small
          sudo mount -t tmpfs -o size=100m,mode=1777 tmpfs /mnt/small
          python3 tests/diskfull.py ./target/release/s3rs /mnt/small
      - name: Server log
        if: always()
        run: cat /tmp/s3rs.log

  tls:
    name: end-to-end over HTTPS (--features tls)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: tests/minio-go/go.sum
      - run: pip install boto3
      - run: cargo build --release --features tls
      - name: Start s3rs with TLS and an https:// webhook
        run: |
          mkdir -p /tmp/tls && tests/tls/gen-certs.sh /tmp/tls
          cp tests/policies/home.json /tmp/home.json
          openssl rand -hex 32 > /tmp/s3rs.key
          printf 'rokey:rosecret:ro\nscoped:scopedsecret:rw:scoped-*,shared-scope\nalice:alicesecret:policy=home.json\n' > /tmp/creds
          S3RS_LIFECYCLE_DAY_SECS=2 ./target/release/s3rs -d /tmp/s3rs-data -l 127.0.0.1:9000 \
            --access-key testkey --secret-key testsecret --credentials-file /tmp/creds \
            --lifecycle-interval 1 --encryption-key-file /tmp/s3rs.key \
            --website-listen 127.0.0.1:9001 --website-domain web.localhost \
            --tls-cert /tmp/tls/leaf.pem --tls-key /tmp/tls/leaf.key \
            --webhook test=https://localhost:9399/hook --webhook-ca /tmp/tls/ca.pem \
            --webhook-secret hooksecret > /tmp/s3rs.log 2>&1 &
          echo $! > /tmp/s3rs.pid
          for i in $(seq 50); do curl -sf --cacert /tmp/tls/ca.pem https://localhost:9000/_health && break; sleep 0.1; done
      - name: boto3 suite over HTTPS
        env:
          S3RS_ENDPOINT: https://localhost:9000
          SSL_CERT_FILE: /tmp/tls/ca.pem
          AWS_CA_BUNDLE: /tmp/tls/ca.pem
          S3RS_RO_ACCESS_KEY: rokey
          S3RS_RO_SECRET_KEY: rosecret
          S3RS_SCOPED_ACCESS_KEY: scoped
          S3RS_SCOPED_SECRET_KEY: scopedsecret
          S3RS_POLICY_ACCESS_KEY: alice
          S3RS_POLICY_SECRET_KEY: alicesecret
          S3RS_WEBHOOK_PORT: "9399"
          S3RS_WEBHOOK_SECRET: hooksecret
          S3RS_WEBHOOK_TLS_CERT: /tmp/tls/leaf.pem
          S3RS_WEBHOOK_TLS_KEY: /tmp/tls/leaf.key
          S3RS_FAST_LIFECYCLE: "1"
          S3RS_ENCRYPTION: "1"
          S3RS_DATA_DIR: /tmp/s3rs-data
          S3RS_WEBSITE_ENDPOINT: https://localhost:9001
          S3RS_WEBSITE_DOMAIN: web.localhost
        run: python3 tests/e2e.py
      - name: minio-go suite over HTTPS
        working-directory: tests/minio-go
        env:
          S3RS_TLS: "1"
          S3RS_ENDPOINT: localhost:9000
          SSL_CERT_FILE: /tmp/tls/ca.pem
        run: go run .
      - name: web console over HTTPS (Playwright)
        env:
          S3RS_CONSOLE_URL: https://localhost:9000
          NODE_EXTRA_CA_CERTS: /tmp/tls/ca.pem
          LANG: C.UTF-8
          S3RS_ACCESS_KEY: testkey
          S3RS_SECRET_KEY: testsecret
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          node tests/console.js
      - name: HTTP/2 over ALPN, and certificate reload on SIGHUP
        run: |
          test "$(curl -s -o /dev/null -w '%{http_version}' --http2 --cacert /tmp/tls/ca.pem https://localhost:9000/_health)" = 2
          serial() { echo | openssl s_client -connect 127.0.0.1:9000 2>/dev/null | openssl x509 -noout -serial; }
          test "$(serial)" = "$(openssl x509 -in /tmp/tls/leaf.pem -noout -serial)"
          cp /tmp/tls/leaf2.pem /tmp/tls/leaf.pem && cp /tmp/tls/leaf2.key /tmp/tls/leaf.key
          kill -HUP "$(cat /tmp/s3rs.pid)"
          for i in $(seq 50); do grep -q 'reloaded the TLS certificate' /tmp/s3rs.log && break; sleep 0.1; done
          test "$(serial)" = "$(openssl x509 -in /tmp/tls/leaf2.pem -noout -serial)"
      - name: healthcheck subcommand over HTTPS
        run: |
          S3RS_LISTEN=127.0.0.1:9000 S3RS_TLS_CERT=/tmp/tls/leaf.pem ./target/release/s3rs healthcheck
          ! ./target/release/s3rs healthcheck -l 127.0.0.1:9000
      - name: fsck after a graceful shutdown
        run: |
          kill -TERM "$(cat /tmp/s3rs.pid)"
          while kill -0 "$(cat /tmp/s3rs.pid)" 2>/dev/null; do sleep 0.2; done
          ./target/release/s3rs fsck -d /tmp/s3rs-data --deep --encryption-key-file /tmp/s3rs.key
      - name: Server log
        if: always()
        run: cat /tmp/s3rs.log

  upgrade:
    name: upgrade from older builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install boto3
      - run: cargo build --release
      # Data written by older builds must read back exactly in this one. The bases are the first
      # commit and the one before the usage counters changed format; add each release here.
      - name: upgrade test
        shell: bash
        run: |
          for base in fa33991 352c28b; do
            git worktree add -f /tmp/src-$base $base
            (cd /tmp/src-$base && CARGO_TARGET_DIR=/tmp/target-old cargo build --release -q)
            cp /tmp/target-old/release/s3rs /tmp/s3rs-$base
            python3 tests/upgrade.py /tmp/s3rs-$base ./target/release/s3rs
          done
